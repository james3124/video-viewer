<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Viewer">
  <defs>
    <linearGradient id="screen" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ab8ff"/>
      <stop offset=".55" stop-color="#4a9eff"/>
      <stop offset="1" stop-color="#2f6fed"/>
    </linearGradient>
    <linearGradient id="shine" x1="16" y1="10" x2="36" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- dark rounded badge -->
  <rect width="64" height="64" rx="16" fill="#0e1116"/>

  <!-- screen -->
  <rect x="7" y="12" width="50" height="40" rx="9" fill="url(#screen)"/>
  <rect x="7" y="12" width="50" height="40" rx="9" fill="url(#shine)"/>

  <!-- play mark -->
